<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project 3 - Calculator</title>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="para">
        <p>
        <h1>Simple calci</h1>
        </p>
    </div>
    <div class="container">
        <div class="display">
            <p class="p1">Expression</p>
            <p class="p2">Answer</p>

        </div>
        <div class="touchpad">
            <div class="chars" data-value="backspace">←</div>
            <div class="chars wipeall" data-value="=">=</div>
            
            <div class="chars" data-value="+">+</div>
            <div class="chars" data-value="1">1</div>
            <div class="chars" data-value="2">2</div>
            <div class="chars" data-value="3">3</div>
            <div class="chars" data-value="-">-</div>
            <div class="chars" data-value="4">4</div>
            <div class="chars" data-value="5">5</div>
            <div class="chars" data-value="6">6</div>
            <div class="chars" data-value="*">*</div>
            <div class="chars" data-value="7">7</div>
            <div class="chars" data-value="8">8</div>
            <div class="chars" data-value="9">9</div>
            <div class="chars" data-value="/">/</div>
            <div class="chars zero" data-value="0">0</div>
            <div class="chars " data-value=".">.</div>
            <div class="chars " data-value="clear">Ac</div>
        </div>
    </div>
<script src="./src/app.js"></script>
</body>

</html>
